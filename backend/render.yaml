services:
  - type: web
    name: oasis-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oasis-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: oasis-db
    plan: free
